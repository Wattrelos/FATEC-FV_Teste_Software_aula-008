<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Laboratório de Testes — Autenticação</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: rgba(30, 41, 59, 0.75);
      --card-border: rgba(255, 255, 255, 0.1);
      --primary: #38bdf8;
      --primary-hover: #0ea5e9;
      --success: #10b981;
      --danger: #ef4444;
      --text: #f8fafc;
      --text-muted: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
    body {
      background: radial-gradient(circle at top, #1e293b, var(--bg));
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }
    .card {
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
      width: 100%;
      max-width: 420px;
      padding: 36px;
      animation: fadeIn 0.3s ease-out;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .logo-container {
      text-align: center;
      margin-bottom: 24px;
    }
    .badge-env {
      display: inline-block;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      padding: 4px 10px;
      border-radius: 9999px;
      background: rgba(56, 189, 248, 0.15);
      color: var(--primary);
      border: 1px solid rgba(56, 189, 248, 0.3);
      margin-bottom: 8px;
    }
    h2 { font-size: 22px; font-weight: 700; color: var(--text); text-align: center; }
    .form-group { margin-bottom: 18px; }
    label { display: block; margin-bottom: 6px; color: var(--text-muted); font-size: 13px; font-weight: 600; }
    input {
      width: 100%;
      padding: 12px 14px;
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid var(--card-border);
      border-radius: 8px;
      font-size: 14px;
      color: var(--text);
      transition: all 0.2s;
    }
    input:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.25);
    }
    button[type="submit"] {
      width: 100%;
      padding: 12px;
      background: var(--primary);
      color: #0f172a;
      border: 0;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 10px;
      transition: all 0.2s;
    }
    button[type="submit"]:hover {
      background: var(--primary-hover);
      transform: translateY(-1px);
    }
    button[type="submit"]:active { transform: translateY(0); }
    .btn-secondary {
      background: rgba(239, 68, 68, 0.15);
      color: #fca5a5;
      border: 1px solid rgba(239, 68, 68, 0.3);
      margin-top: 15px;
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn-secondary:hover { background: var(--danger); color: #fff; }
    .btn-link {
      display: block;
      text-align: center;
      margin-top: 12px;
      font-size: 13px;
      color: var(--primary);
      text-decoration: none;
    }
    .btn-link:hover { text-decoration: underline; }
    .message {
      margin-top: 18px;
      padding: 12px 14px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 500;
      text-align: center;
      display: none;
      animation: slideDown 0.2s ease-out;
    }
    @keyframes slideDown {
      from { opacity: 0; transform: translateY(-6px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .message.error {
      background: rgba(239, 68, 68, 0.15);
      color: #fca5a5;
      border: 1px solid rgba(239, 68, 68, 0.3);
      display: block;
    }
    .message.success {
      background: rgba(16, 185, 129, 0.15);
      color: #6ee7b7;
      border: 1px solid rgba(16, 185, 129, 0.3);
      display: block;
    }
    .dashboard { display: none; text-align: center; }
    .dashboard h3 { color: var(--success); margin-bottom: 10px; font-size: 20px; }
    .user-info { margin-top: 8px; font-size: 14px; color: var(--text-muted); }
  </style>
</head>
<body>
  <main class="card" id="login-container">
    <section id="login-form-wrapper" aria-labelledby="login-title">
      <div class="logo-container">
        <span class="badge-env">Laboratório de Teste de Software</span>
        <h2 id="login-title">Acesso ao Sistema</h2>
      </div>

      <form id="loginForm" method="POST" action="/login">
        <div class="form-group">
          <label for="email">E-mail Corporativo</label>
          <input type="email" id="email" name="email" data-testid="input-email" placeholder="usuario@teste.com" autocomplete="username">
        </div>
        <div class="form-group">
          <label for="password">Senha de Acesso</label>
          <input type="password" id="password" name="password" data-testid="input-password" placeholder="Sua senha" autocomplete="current-password">
        </div>
        <input type="hidden" name="csrf_token" id="csrf_token" data-testid="input-csrf" value="">
        <button type="submit" id="submit-btn" data-testid="button-submit">Entrar</button>
      </form>
    </section>

    <div id="feedback" class="message" data-testid="feedback-message" role="status" aria-live="polite"></div>

    <section id="dashboard" class="dashboard" data-testid="dashboard-panel" aria-labelledby="dashboard-title">
      <h3 id="dashboard-title">Bem-vindo à Área Logada!</h3>
      <p id="dashboard-welcome">Você acessou o painel principal com sucesso.</p>
      <div id="user-display" class="user-info"></div>
      <button type="button" id="logout-btn" class="btn-secondary" data-testid="button-logout">Sair do Sistema</button>
      <a href="/dashboard.html" class="btn-link" id="link-dashboard">Ir para Tela Completa de Dashboard &rarr;</a>
    </section>
  </main>

  <script>
    const form = document.getElementById("loginForm");
    const feedback = document.getElementById("feedback");
    const formWrapper = document.getElementById("login-form-wrapper");
    const dashboard = document.getElementById("dashboard");
    const userDisplay = document.getElementById("user-display");
    const logoutBtn = document.getElementById("logout-btn");
    const csrfInput = document.getElementById("csrf_token");

    let currentCsrfToken = "";

    async function carregarCsrfToken() {
      if (window.location.protocol.startsWith("http")) {
        try {
          const response = await fetch("/api/csrf-token");
          const data = await response.json();
          if (data.success && data.data?.csrf_token) {
            currentCsrfToken = data.data.csrf_token;
            if (csrfInput) {
              csrfInput.value = currentCsrfToken;
            }
          }
        } catch (e) {
          console.warn("CSRF token fetch error:", e);
        }
      }
    }
    carregarCsrfToken();

    // Lê parâmetros da URL caso tenha havido redirecionamento
    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.has("msg")) {
      showFeedback("success", urlParams.get("msg"));
    } else if (urlParams.has("error")) {
      showFeedback("error", urlParams.get("error"));
    }

    function showFeedback(type, text) {
      feedback.className = "message " + type;
      feedback.textContent = text;
    }

    function clearFeedback() {
      feedback.className = "message";
      feedback.textContent = "";
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      clearFeedback();

      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;

      if (!email || !password) {
        showFeedback("error", "Preencha todos os campos obrigatórios.");
        return;
      }

      // Se executado via HTTP/HTTPS, chama a API backend Slim 4
      if (window.location.protocol.startsWith("http")) {
        try {
          const response = await fetch("/api/login", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              "Accept": "application/json",
              "X-Requested-With": "XMLHttpRequest",
              "X-CSRF-Token": currentCsrfToken
            },
            body: JSON.stringify({ email, password, csrf_token: currentCsrfToken })
          });

          const rotatedToken = response.headers.get("X-CSRF-Token");
          if (rotatedToken) {
            currentCsrfToken = rotatedToken;
            if (csrfInput) csrfInput.value = rotatedToken;
          } else {
            await carregarCsrfToken();
          }

          const data = await response.json();

          if (response.ok && data.success) {
            showFeedback("success", data.data?.message || "Login realizado com sucesso!");
            setTimeout(() => {
              formWrapper.style.display = "none";
              dashboard.style.display = "block";
              if (data.data?.user) {
                userDisplay.textContent = `Usuário: ${data.data.user.name} (${data.data.user.email})`;
              }
            }, 300);
          } else {
            showFeedback("error", data.error || "Credenciais inválidas.");
          }
        } catch (err) {
          showFeedback("error", "Erro ao conectar com o servidor.");
        }
      } else {
        // Fallback para execução offline/file:///
        const MOCK_USERS = {
          "usuario@teste.com": { password: "Senha@123", status: true },
          "inativo@teste.com": { password: "Senha@123", status: false }
        };

        const user = MOCK_USERS[email];
        if (!user) {
          showFeedback("error", "Credenciais inválidas.");
          return;
        }

        if (!user.status) {
          showFeedback("error", "Conta de cliente desativada.");
          return;
        }

        if (password !== user.password) {
          showFeedback("error", "Credenciais inválidas.");
          return;
        }

        showFeedback("success", "Login realizado com sucesso!");
        setTimeout(() => {
          formWrapper.style.display = "none";
          dashboard.style.display = "block";
        }, 300);
      }
    });

    logoutBtn.addEventListener("click", async () => {
      if (window.location.protocol.startsWith("http")) {
        await fetch("/api/logout", {
          method: "POST",
          headers: { "Accept": "application/json" }
        });
      }
      dashboard.style.display = "none";
      formWrapper.style.display = "block";
      document.getElementById("email").value = "";
      document.getElementById("password").value = "";
      showFeedback("success", "Sessão encerrada com sucesso.");
    });
  </script>
</body>
</html>
