name: CI / Quality & Test Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-quality-and-tests:
    name: Backend QA (PHP 8.4)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar ambiente PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: mbstring, pdo, session, json, filter
          coverage: none

      - name: Cache de dependências do Composer
        uses: actions/cache@v4
        with:
          path: vendor
          key: ${{ runner.os }}-composer-8.4-${{ hashFiles('**/composer.json') }}
          restore-keys: |
            ${{ runner.os }}-composer-8.4-

      - name: Instalar dependências PHP
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Validação de Estilo de Código (PSR-12 / PHP-CS-Fixer)
        run: composer cs-check

      - name: Análise Estática Avançada (PHPStan Nível 5)
        run: composer stan

      - name: Execução dos Testes Automatizados (Pest / PHPUnit)
        run: composer test

  e2e-and-bdd-tests:
    name: Frontend E2E & BDD (Python Playwright)
    runs-on: ubuntu-latest
    needs: backend-quality-and-tests

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar ambiente PHP para servidor de teste
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: mbstring, pdo, session, json, filter

      - name: Instalar dependências PHP
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Configurar ambiente Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Instalar dependências Python
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Instalar navegadores do Playwright e dependências do sistema
        run: playwright install --with-deps chromium

      - name: Executar Pipeline Completo E2E / BDD
        run: |
          chmod +x ./executar_testes.sh
          # Inicia servidor web PHP em background
          php -S 127.0.0.1:8088 -t public public/index.php &
          SERVER_PID=$!
          sleep 2

          # BDD com Behave
          TEST_BASE_URL="http://127.0.0.1:8088/login.html" python -m behave

          # Simulação E2E de telas com Playwright
          TEST_BASE_URL="http://127.0.0.1:8088" TEST_HEADLESS=true python test_playwright_telas.py

          kill $SERVER_PID || true
